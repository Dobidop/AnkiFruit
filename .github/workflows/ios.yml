# Builds Anki's rslib for Apple targets, then exercises the Swift -> C -> Rust
# FFI on a real iOS simulator. Phase 0 proved the cross-compile; the simulator
# job is what proves the Swift layer actually talks to the backend.
name: iOS

on:
  push:
    paths:
      - "rust/**"
      - "ios/**"
      - "tools/**"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  rust:
    name: rslib to ${{ matrix.target }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/anki carries its own ftl/* submodules holding translations;
          # without them rslib's i18n build script panics in gather.rs.
          submodules: recursive

      - run: brew install protobuf

      - run: rustup target add ${{ matrix.target }}
        working-directory: rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # Must precede cargo: rslib's build script reads this file, and an
      # absent one silently yields an empty Anki build hash.
      - name: Record linked Anki version
        run: tools/write-buildhash.sh

      - name: Build static library
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }} -p ankifruit-core

      - uses: actions/upload-artifact@v4
        with:
          name: libankifruit_core-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/libankifruit_core.a
          if-no-files-found: error

  simulator-tests:
    name: FFI tests on iOS Simulator
    needs: rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: slices

      - name: Assemble xcframework
        run: |
          mkdir -p ios/Frameworks
          xcodebuild -create-xcframework \
            -library slices/libankifruit_core-aarch64-apple-ios/libankifruit_core.a \
            -headers rust/ankifruit-core/include \
            -library slices/libankifruit_core-aarch64-apple-ios-sim/libankifruit_core.a \
            -headers rust/ankifruit-core/include \
            -output ios/Frameworks/AnkiFruitCore.xcframework

      - name: Pick a simulator
        id: sim
        run: |
          # Use whatever iOS runtime this image ships; pinning a device name
          # breaks every time GitHub rotates the image.
          name=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['name'] for k,v in d.items() if 'iOS' in k for x in v))")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $name"

      - name: Run FFI tests
        working-directory: ios
        run: |
          xcodebuild test \
            -scheme AnkiFruitKit \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults.xcresult
          path: ios/TestResults.xcresult
          if-no-files-found: ignore

      - name: Report sizes
        if: always()
        run: |
          echo "### Static library size" >> "$GITHUB_STEP_SUMMARY"
          ls -lh slices/*/libankifruit_core.a | awk '{print "- " $NF ": " $5}' >> "$GITHUB_STEP_SUMMARY"
          du -sh ios/Frameworks/AnkiFruitCore.xcframework >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Unsigned .ipa
    needs: rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          path: slices

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: brew install xcodegen

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage web UI into the app bundle
        run: |
          rm -rf ios/App/Resources/web
          cp -R web/dist ios/App/Resources/web

      - name: Assemble xcframework
        run: |
          mkdir -p ios/Frameworks
          xcodebuild -create-xcframework             -library slices/libankifruit_core-aarch64-apple-ios/libankifruit_core.a             -headers rust/ankifruit-core/include             -library slices/libankifruit_core-aarch64-apple-ios-sim/libankifruit_core.a             -headers rust/ankifruit-core/include             -output ios/Frameworks/AnkiFruitCore.xcframework

      - name: Generate Xcode project
        working-directory: ios/App
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive             -project ios/App/AnkiFruit.xcodeproj             -scheme AnkiFruit             -configuration Release             -destination 'generic/platform=iOS'             -archivePath build/AnkiFruit.xcarchive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          # AltStore/SideStore re-sign with the user's own Apple ID at install
          # time, so an unsigned payload is what they expect.
          mkdir -p build/Payload
          cp -R build/AnkiFruit.xcarchive/Products/Applications/AnkiFruit.app build/Payload/
          (cd build && zip -qry AnkiFruit.ipa Payload)
          rm -rf build/Payload

      - name: Report real install size
        run: |
          app=build/AnkiFruit.xcarchive/Products/Applications/AnkiFruit.app
          {
            echo "### Install size"
            echo ""
            echo "| | size |"
            echo "|---|---|"
            echo "| .ipa (download) | $(ls -lh build/AnkiFruit.ipa | awk '{print $5}') |"
            echo "| .app bundle (installed) | $(du -sh $app | awk '{print $1}') |"
            echo "| binary | $(ls -lh $app/AnkiFruit | awk '{print $5}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: AnkiFruit-unsigned-ipa
          path: build/AnkiFruit.ipa
          if-no-files-found: error
