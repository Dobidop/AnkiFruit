[package]
name = "ankifruit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C ABI + localhost protobuf bridge exposing Anki's Rust backend to the AnkiFruit iOS shell"
publish = false

[lib]
name = "ankifruit_core"
# staticlib: linked into the iOS app. cdylib/rlib: desktop harness + tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["rustls"]
rustls = ["anki/rustls"]
native-tls = ["anki/native-tls"]

[dependencies]
anki = { path = "../../vendor/anki/rslib", default-features = false }
anki_proto = { path = "../../vendor/anki/rslib/proto" }
anyhow = "1.0.98"
axum = "0.8.4"
prost = "0.13"
rand = "0.9.4"
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "macros"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing = "0.1.41"

[build-dependencies]
anki_proto_gen = { path = "../../vendor/anki/rslib/proto_gen" }
anyhow = "1.0.98"
prost-reflect = "0.14.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tempfile = "3"
